<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo</title>
</head>
<body>
    <p>hello world</p>
    <form id="dataForm">
        <label for="name"></label>
        <input name="name" type="text">
        <input type="text" name="favAnim">
        <input type="text" name="favFood">
        <button type="submit">SUBMIT</button>
    </form>
    <script>
        let dataFormEl = document.getElementById("dataForm");
        dataFormEl.addEventListener("submit", async e => {
            e.preventDefault();

            let formData = new FormData(dataFormEl);
            let data = Object.fromEntries(formData.entries());
            console.log(data);

            let response = await fetch("/api/add", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            });
            let responseJSON = await response.json();
            console.log(responseJSON.name);
        });
    </script>

</body>
